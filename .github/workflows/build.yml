name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install NDK and CMake
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          ls "$SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "ndk;28.0.12433566" "cmake;3.22.1"

      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build python3

      - name: Fetch engine, apply gift, build
        run: |
          chmod +x apply.sh
          ./apply.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HalfLife-Gift-APK
          path: engine/android/**/*.apk

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          include-hidden-files: true
          path: |
            build.log
            engine/android/app/.cxx/**/*.txt
            engine/android/app/.cxx/**/*.log
