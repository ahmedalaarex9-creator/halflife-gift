name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake (NDK 28 builds 16KB-aligned libs for newest Android)
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.0.12433566" "cmake;3.22.1"

      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build python3

      - name: Fetch engine, apply gift, build
        run: |
          chmod +x apply.sh
          ./apply.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HalfLife-Gift-APK
          path: engine/android/**/*.apk
